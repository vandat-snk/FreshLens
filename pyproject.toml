[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshlens"
version = "1.0.0"
description = "FreshLens - modular EfficientNet-B0 fruit type and fresh/rotten classification pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
