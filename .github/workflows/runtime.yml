name: Runtime checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-torch-cpu.txt
      - run: python -m pytest tests/tv3 tests/submission tests/test_camera_dataset.py tests/test_dataset_v2.py tests/test_reviewed_candidate.py -q
      - run: python -m tests.refactor.TEST_APP_REFACTOR
